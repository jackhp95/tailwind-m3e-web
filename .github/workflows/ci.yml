name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Integrity job: enforce that the committed lockfile matches package.json.
  # Runs against the committed deps as-is (no matrix mutation), so a frozen
  # install is meaningful here. The compat matrix below intentionally mutates
  # deps and therefore cannot use a frozen lockfile.
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install with frozen lockfile (fails on package.json/lockfile drift)
        run: pnpm install --frozen-lockfile
      - name: Verify committed generated artifacts are up to date
        run: |
          pnpm run generate
          git diff --exit-code -- generated/ src/ref/_tone-table.css \
            || (echo "::error::Generated artifacts are stale. Run 'pnpm run generate' and commit." && exit 1)
      - name: Check @m3e/web privates still exist upstream
        run: pnpm run check:privates
      - name: Test
        run: pnpm test

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
        m3e-version: ["2.5.0", "2.5.10", "2.5.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      # This matrix mutates @m3e/web below, so a frozen lockfile is not
      # applicable here; --no-frozen-lockfile is intentional (lockfile
      # integrity is enforced by the `integrity` job).
      - run: pnpm install --no-frozen-lockfile
      - name: Pin @m3e/web for matrix entry
        run: pnpm add -D "@m3e/web@${{ matrix.m3e-version }}"
      - name: Regenerate utilities for this @m3e/web version
        run: pnpm run generate:utilities
      # Committed-artifact drift + check:privates are enforced once by the
      # `integrity` job against the pinned deps; this matrix leg only proves
      # the codegen + tests work across @m3e/web versions and Node 20/22.
      - name: Test
        run: pnpm test
