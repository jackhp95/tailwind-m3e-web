name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
        m3e-version: ["2.5.0", "2.5.10", "2.5.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: Pin @m3e/web for matrix entry
        run: pnpm add -D "@m3e/web@${{ matrix.m3e-version }}"
      - name: Regenerate utilities for this @m3e/web version
        run: pnpm run generate:utilities
      - name: Verify committed generated artifacts are up to date
        # Only meaningful on the leg whose installed @m3e/web matches the
        # committed pin — other legs intentionally regenerate off-pin output.
        # Also regenerate the tone table; both must match what is committed.
        if: matrix.m3e-version == '2.5.10'
        run: |
          pnpm run generate:tones
          git diff --exit-code -- generated/ src/ref/_tone-table.css \
            || (echo "::error::Generated artifacts are stale. Run 'pnpm run generate' and commit." && exit 1)
      - name: Check @m3e/web privates still exist upstream
        if: matrix.m3e-version == '2.5.10'
        run: pnpm run check:privates
      - name: Test
        run: pnpm test
